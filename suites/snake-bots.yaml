# Free-for-all ladder of the model-free baselines. Leaderboard floor every other entry is read against.
name: snake-bots
game: snake
description: 4-snake free-for-all among scripted bots and the random agent.
config: {rounds: 3, round_seconds: 60}
clock: charged
obs_mode: state
seeds: {set: dev, count: 8}
lineups:
  - [bot:scripted, bot:scripted, random, random]
rotation: cyclic
entrants:
  random: {kind: agent, agent: random}
limits: {match_timeout_s: 600, concurrency: 4, retries: 1}
leaderboard: true
