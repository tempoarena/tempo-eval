# One short match, one LLM seat. The "does the LLM path work at all" check (~cents).
name: snake-llm-tiny
game: snake
config: {rounds: 1, round_seconds: 20}
clock: wallclock
obs_mode: state
seeds: {set: dev, count: 1}
lineups:
  - [llm, bot:scripted]
rotation: none
entrants:
  llm: {kind: agent, agent: llm, model: bedrock_mantle/openai.gpt-5.6-luna}
limits: {match_timeout_s: 120, concurrency: 1, retries: 0, cost_cap_usd: 0.25, suite_cost_cap_usd: 0.25}
