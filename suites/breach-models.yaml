# Breach 1v1 duels: each model agent against the scripted bot, both sides.
name: breach-models
game: breach
description: LLM+skills, Jev and hybrid agents vs the scripted bot, 1v1, both sides.
config: {team_size: 1, rounds_to_win: 2, max_rounds: 2, round_seconds: 45, buy_seconds: 5}
clock: charged
obs_mode: state
seeds: {set: dev, count: 1}
lineups:
  - [llm-skills, bot:scripted]
  - [jev, bot:scripted]
  - [hybrid, bot:scripted]
rotation: swap
entrants:
  llm-skills: {kind: agent, agent: llm-skills, model: bedrock_mantle/openai.gpt-5.6-luna}
  jev: {kind: agent, agent: jev, model: jev-latest}
  hybrid: {kind: agent, agent: hybrid, model: bedrock_mantle/openai.gpt-5.6-luna}
limits: {match_timeout_s: 600, concurrency: 2, retries: 0, cost_cap_usd: 1.0, suite_cost_cap_usd: 5.0}
leaderboard: true
