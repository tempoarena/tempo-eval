[project]
name = "tempo-eval"
version = "0.1.0"
description = "TEMPO evaluation: match runner, metrics, ratings, latency frontiers, leaderboard publishing."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Yunzhe" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openskill>=6.0",
]

[project.optional-dependencies]
# The pinned tempo: engine + server + client, and the baseline agents. One SHA, bumped with
# scripts/bump-tempo.sh. Kept optional so tests (fake server) run without building Rust.
tempo = [
    "tempo-arena @ git+https://github.com/tempoarena/tempo@6c765716af15910efbd892da4b2c25d4d571030e",
]

[project.scripts]
tempo-eval = "tempo_eval.cli:main"

[project.urls]
Homepage = "https://tempoarena.org"
Source = "https://github.com/tempoarena/tempo-eval"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
