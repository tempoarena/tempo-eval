[project]
name = "tempo-eval"
version = "0.1.0"
description = "TEMPO evaluation: match runner, metrics, ratings, latency frontiers, leaderboard publishing."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Yunzhe" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openskill>=6.0",
]

[project.optional-dependencies]
# The pinned tempo: engine + server + client, and the baseline agents. One SHA, bumped with
# scripts/bump-tempo.sh. Kept optional so tests (fake server) run without building Rust.
tempo = [
    "tempo-arena @ git+https://github.com/tempoarena/tempo@791c36e4a8a8f2b992a28395c1222f08bc04d822",
    "tempo-baselines @ git+https://github.com/tempoarena/tempo@791c36e4a8a8f2b992a28395c1222f08bc04d822#subdirectory=baselines",
]

[project.scripts]
tempo-eval = "tempo_eval.cli:main"

[project.urls]
Homepage = "https://tempoarena.org"
Source = "https://github.com/tempoarena/tempo-eval"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the tempo pin is a git direct reference
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Same constraint as tempo: numpy >= 2.3 ships manylinux_2_28 wheels only, and development hosts
# on glibc 2.26 (Amazon Linux 2) would build it from source and fail. Constrains this lock only.
constraint-dependencies = ["numpy<2.3"]
